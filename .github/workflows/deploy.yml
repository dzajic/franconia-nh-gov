name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 12:00 UTC. Recomputes the archive's rolling window.
    # GitHub runs scheduled workflows from the default branch only, after this file is on main.
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pages: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          # configure-pages base_path is /<repo> on project sites and empty on user sites.
          # Eleventy prefixes URLs. Files are published at the root of gh-pages.
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Optional repository variable. Empty falls back to the placeholder base.
          ARCHIVE_BASE_URL: ${{ vars.ARCHIVE_BASE_URL }}
        run: npm run build

      - name: Check internal links
        env:
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: npm run check:links

      # Branch deploys run Jekyll unless this file is at the site root.
      # The previous artifact deploy did not. Pagefind output must be copied as-is.
      - name: Disable Jekyll on GitHub Pages
        run: touch _site/.nojekyll

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          # Pull request previews live here. A full clean would delete them.
          clean-exclude: pr-preview/
          # Rebase onto gh-pages instead of force-pushing, so a preview commit
          # that landed while this build ran is kept.
          force: false
          commit-message: Deploy production site
