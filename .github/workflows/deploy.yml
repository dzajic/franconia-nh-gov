name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 12:00 UTC. Recomputes the archive's rolling window.
    # GitHub runs scheduled workflows from the default branch only, after this file is on main.
    - cron: "0 12 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install deps
        run: npm ci

      # If you already have "build" in package.json, this will use it.
      # If not, replace this step with:
      #   npx @11ty/eleventy --pathprefix "${{ steps.pages.outputs.base_path }}"
      - name: Build
        env:
          # configure-pages base_path is /<repo> on project sites and empty on user sites.
          # Eleventy prefixes URLs; files stay at the root of the Pages artifact.
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Optional repository variable. Empty falls back to the placeholder base.
          ARCHIVE_BASE_URL: ${{ vars.ARCHIVE_BASE_URL }}
        run: npm run build

      - name: Check internal links
        env:
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: npm run check:links

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Common Eleventy output dir. Change if yours differs.
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
