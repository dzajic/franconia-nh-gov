name: PR preview fork note

# Posts a comment when a pull request comes from a fork.
# pull_request_target runs this file from the default branch with permission
# to comment. It does not check out the pull request, install code, build,
# or read secrets. Do not add a checkout of the fork head to this workflow.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  note:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment that the preview was skipped
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview-fork-skip -->";
            const body = [
              marker,
              "Preview deployments are skipped for pull requests from forks.",
              "A preview is published only for a branch in this repository. That keeps the `gh-pages` publish on the built-in token and keeps secrets out of untrusted code.",
              "The preview workflow still builds this pull request and checks internal links.",
            ].join("\n\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user &&
                comment.user.login === "github-actions[bot]" &&
                comment.body &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
